[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/app/logs

[program:backend]
command=node /app/backend/server.js
directory=/app/backend
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/app/logs/backend.log
stderr_logfile=/app/logs/backend-error.log
environment=NODE_ENV="production"

[program:scraper]
command=python /app/scraper/main.py
directory=/app/scraper
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/app/logs/scraper.log
stderr_logfile=/app/logs/scraper-error.log
